name: Demostrador para Acciones GitHub

on:
  workflow_dispatch:

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name:  Mostrar información básica del repositorio
        run: |
          echo " Repositorio: ${{ github.repository }}"
          echo " Evento disparador: ${{ github.event_name }}"
          echo " Rama: ${{ github.ref }}"
          echo " Runner OS: ${{ runner.os }}"
          echo " Runner tipo: ${{ runner.name }}"
          echo " Arquitectura: ${{ runner.arch }}"

      - name: Clonar el repositorio
        uses: actions/checkout@v3
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      
      - name: Mostrar archivos del repositorio
        run: |
          ls ${{ github.workspace }}
      - run: echo " This job's status is ${{ job.status }}."

  dump_contexts_to_log:
    name: Mostrar contextos disponibles
    runs-on: ubuntu-latest
    steps:
      - name: Contexto GitHub
        id: github_context_step
        run: echo '${{ toJSON(github) }}'
      - name: Contexto job
        run: echo '${{ toJSON(job) }}'
      - name: Contexto steps
        run: echo '${{ toJSON(steps) }}'
      - name: Contexto runner
        run: echo '${{ toJSON(runner) }}'
      - name: Contexto strategy
        run: echo '${{ toJSON(strategy) }}'
      - name: Contexto matrix
        run: echo '${{ toJSON(matrix) }}'

